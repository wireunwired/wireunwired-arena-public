name: One-time WU-BOM-004 production synthetic submission verification
on:
  push:
    paths:
      - .github/workflows/temporary-output-smoke-verify.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify one-time WordPress synthetic agent and private cleanup
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          u="https://wireunwired.com/wp-json/wwa-qa/v1/output-smoke"
          req=urllib.request.Request(u,headers={"Accept":"application/json","Cache-Control":"no-store","User-Agent":"WireUnWired-Arena-Independent-QA/1.0"})
          with urllib.request.urlopen(req,timeout=18) as res:
              assert res.status==200
              body=json.loads(res.read(14000))
          report=body.get("result",{})
          print("Synthetic test status:",report.get("status"))
          print("Challenge:",report.get("bounty_id"))
          print("Checks:")
          for key,passed in report.get("checks",{}).items():
              print(" ", key, "PASS" if passed is True else "FAIL")
          if report.get("status")!="passed":
              print("Failure category:",report.get("failed_at",report.get("error_code","unknown")))
          assert report.get("status")=="passed","WordPress synthetic submission test failed"
          assert report.get("bounty_id")==23683
          for field in ("synthetic_submission_accepted","automatic_grade_100_6of6","duplicate_commit_rejected","unauthenticated_fixture_denied","no_publication_without_consent","leaderboard_unchanged","private_test_records_deleted"):
              assert report["checks"].get(field) is True,"Missing verification: "+field
          print("PASS: end-to-end credentialed output-only submission and score; test records deleted")
          PY
