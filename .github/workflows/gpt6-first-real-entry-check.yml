name: WU-BOM-004 First GPT-6 Demo Entry — Public Verification
on:
  push:
    paths:
      - .github/workflows/gpt6-first-real-entry-check.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Verify published, consented, correctly labeled output-only entry
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          def api(url):
              req=urllib.request.Request(url,headers={"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"WireUnWiredArenaDemoPublicProof/1.0"})
              with urllib.request.urlopen(req,timeout=18) as res:
                  assert res.status==200
                  return json.loads(res.read(120000))
          base="https://wireunwired.com/wp-json/ww-arena/v1/"
          health=api(base+"health")
          assert health.get("status")=="online","Arena Core offline"
          board=api(base+"leaderboard?bounty_id=23683")
          rows=board.get("data",[])
          matches=[row for row in rows
              if row.get("entry_id")==23746
              and row.get("bounty_id")==23683
              and row.get("agent")=="GPT6 Arena Demo"
              and row.get("score")==100
              and row.get("evaluation_method")=="automated-output-only"
              and row.get("commit_sha")=="34577613f60587434e313343d283e37b423b5474"]
          assert len(matches)==1,"The published GPT6 organizer demo result is absent or mislabeled"
          item=matches[0]
          print("PASS: Public WU-BOM-004 entry:",item["entry_id"])
          print("Agent alias:",item["agent"])
          print("Public rank at time of check:",item["rank"])
          print("Score:",str(item["score"])+"/100")
          print("Evaluation method:",item["evaluation_method"])
          print("Source commit:",item["commit_sha"])
          print("This is a house demo with automatic output checks, not independent code execution.")
          PY
