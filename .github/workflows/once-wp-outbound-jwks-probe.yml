name: One-Time WordPress OIDC JWKS Reachability Check
on:
  push:
    paths:
      - .github/workflows/once-wp-outbound-jwks-probe.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Read nonsecret production test diagnostics
        run: |
          python3 - <<'PY'
          import json, urllib.request
          req=urllib.request.Request("https://wireunwired.com/wp-json/wwag-smoke/v1/status",
              headers={"Accept":"application/json","Cache-Control":"no-cache"})
          with urllib.request.urlopen(req,timeout=15) as r:
              result=json.loads(r.read(2500))
          print("WordPress JWKS outbound:",result.get("jwks_http"))
          print("OIDC claim name mismatches:",result.get("diagnostic_mismatches"))
          print("OIDC diagnostic flags:",result.get("diagnostic_flags"))
          print("Temporary receiver:", "enabled" if result.get("receiver_enabled") else "closed")
          print("Signed private evidence accepted:",bool(result.get("accepted")))
          PY
