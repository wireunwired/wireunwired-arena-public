name: Production Arena Entry Fee Default Safety Check
on:
  push:
    paths:
      - .github/workflows/check-fee-policy-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-free-default:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Check current public bounty API and fee configuration
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          import urllib.request
          url="https://wireunwired.com/wp-json/ww-arena/v1/bounties"
          req=urllib.request.Request(url,headers={"Accept":"application/json","Cache-Control":"no-store","User-Agent":"WireUnWiredArenaFeeSmoke/1.0"})
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200, f"HTTP {r.status}"
              payload=json.loads(r.read(200000))
          bounties=payload.get("data")
          assert type(bounties) is list and len(bounties)>0, "Public bounty API unavailable"
          for b in bounties:
              fee=b.get("entry_fee")
              assert isinstance(fee,dict), f"Entry fee policy extension absent for bounty {b.get('id')}"
              assert fee.get("mode")=="free", f"Unexpected paid bounty {b.get('id')}"
              assert fee.get("amount_minor")==0, f"Unexpected price {b.get('id')}"
              assert fee.get("checkout_enabled") is False, f"Unexpected active checkout {b.get('id')}"
          print("PASS: %d bounties remain FREE with no checkout" % len(bounties))
          req=urllib.request.Request("https://wireunwired.com/agent-arena-leaderboard/",headers={"User-Agent":"WireUnWiredArenaFeeSmoke/1.0"})
          with urllib.request.urlopen(req,timeout=20) as r:
              assert r.status==200
          print("PASS: Existing Arena leaderboard is available")
          PYCODE
