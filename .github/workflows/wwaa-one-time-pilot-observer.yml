name: One-Time Private WASM Pilot Readback (Nonsecret)
on:
  push:
    paths:
      - .github/workflows/wwaa-one-time-pilot-observer.yml
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Inspect active one-off WordPress queue without private metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request
          url="https://wireunwired.com/wp-json/wwaa-smoke/v1/status"
          req=urllib.request.Request(url,headers={"Accept":"application/json","Cache-Control":"no-store"})
          with urllib.request.urlopen(req,timeout=16) as r:
              assert r.status==200
              x=json.loads(r.read(5000))
          assert x.get("schema")=="one-time-signed-wasm-pilot-v1"
          print("Synthetic registration verified:",x.get("registered_via_real_apis"))
          print("Private entry present:",x.get("entry_is_private"))
          print("Private queue state:",x.get("queue_state"))
          print("Pilot phase:",x.get("phase"))
          print("Public score remains absent:",x.get("public_score_empty"))
          print("Public consent remains off:",x.get("consent_off"))
          print("Authenticated private grade stored:",x.get("authenticated"))
          print("Duplicate evidence denied:",x.get("replay_denied"))
          print("Global queue switch now closed:",not x.get("accepting"))
          assert x.get("registered_via_real_apis") is True
          assert x.get("entry_is_private") is True
          assert x.get("consent_off") is True
          assert x.get("public_score_empty") is True
          assert x.get("queue_state") in ("queued","claimed","graded")
          assert x.get("phase") in ("queued","evidence_accepted","graded")
          print("PASS: Disposable private registered test entry is isolated; public scoring untouched")
          PY
